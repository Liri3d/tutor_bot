# amvera.yml
meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt
  useCache: true

run:
  command: gunicorn wsgi_sqlite:application --bind 0.0.0.0:${PORT}
  persistenceMount: /data
  scriptName: run.py
  containerPort: ${PORT}
  servicePort: ${PORT}
